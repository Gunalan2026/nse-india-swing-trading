name: NSE India Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1-5'

permissions:
  contents: write

concurrency:
  group: nse-stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Run scanner
        run: python scanner/scanner.py

      - name: Verify results
        run: test -s scanner/results.json

      - name: Commit scanner results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner/results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Nifty 500 scanner results'
            git push
          else
            echo 'No changes to scanner results'
          fi
