name: NSE India Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1-5'  # 19:30 IST, after NSE publishes the daily bhavcopy

permissions:
  contents: write

concurrency:
  group: nse-stock-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Run scanner
        run: python scanner/scanner.py

      - name: Verify results
        run: test -s scanner/results.json

      - name: Check prices against NSE bhavcopy
        continue-on-error: true
        run: python scanner/nse_verify.py

      - name: Generate charts (core five + scanner candidates)
        id: charts
        continue-on-error: true
        run: python scanner/chart_data.py

      - name: Keep previous charts if chart generation failed
        if: steps.charts.outcome == 'failure'
        run: |
          git checkout -- charts/data/
          git clean -fd charts/data/

      - name: Commit scanner results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner/results.json scanner/nifty500_constituents.csv
          git add -A charts/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update Nifty 500 scanner results and charts'
            git push
          else
            echo 'No changes to scanner results'
          fi
