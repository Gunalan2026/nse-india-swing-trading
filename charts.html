
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE India | Candlestick Charts</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b1220;
  color: #e5edf7;
  font-family: Arial, sans-serif;
}
header {
  padding: 18px;
  background: #111d30;
  border-bottom: 1px solid #26364d;
}
h1 { font-size: 21px; margin: 0 0 8px; }
p { color: #a8b8cb; line-height: 1.5; }
main { padding: 12px; max-width: 1200px; margin: auto; }
.panel {
  background: #111d30;
  border: 1px solid #26364d;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
}
select, button {
  padding: 12px;
  border-radius: 8px;
  font-size: 16px;
}
select {
  background: #0b1220;
  color: white;
  border: 1px solid #40536e;
  width: 100%;
  margin-bottom: 10px;
}
button {
  background: #21b6a8;
  color: #07141e;
  border: 0;
  font-weight: bold;
}
.chart { height: 430px; width: 100%; }
.small-chart { height: 160px; width: 100%; }
a { color: #50d8ca; }
.note { font-size: 13px; }
#status { color: #a8b8cb; }
</style>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header>
  <h1>NSE India – Candlestick Charts</h1>
  <p>Nifty 500 Swing Trading Research</p>
  <a href="index.html">Back to Dashboard</a>
</header>
<main>
  <section class="panel">
    <label for="symbol">Select NSE Stock</label>
    <select id="symbol">
      <option value="RELIANCE">RELIANCE</option>
      <option value="TCS">TCS</option>
      <option value="INFY">INFY</option>
      <option value="HDFCBANK">HDFCBANK</option>
      <option value="ICICIBANK">ICICIBANK</option>
    </select>
    <button onclick="loadStock()">Load Chart</button>
    <p id="status">Loading...</p>
  </section>

  <section class="panel">
    <h3 id="heading">Daily Candlestick Chart</h3>
    <div id="priceChart" class="chart"></div>
  </section>

  <section class="panel">
    <h3>RSI (14)</h3>
    <div id="rsiChart" class="small-chart"></div>
  </section>

  <section class="panel">
    <h3>MACD (12, 26, 9)</h3>
    <div id="macdChart" class="small-chart"></div>
  </section>

  <section class="panel">
    <p class="note">
      Data: Yahoo Finance via yfinance.
      Daily historical adjusted prices.
      Delayed/unofficial data.
      Research and paper trading only.
    </p>
  </section>
</main>

<script>
const charts = [];
const colors = {
  background: "#111d30",
  text: "#a8b8cb",
  grid: "#26364d"
};

function makeChart(id) {
  const element = document.getElementById(id);
  const chart = LightweightCharts.createChart(element, {
    width: element.clientWidth,
    height: element.clientHeight,
    layout: {
      background: { color: colors.background },
      textColor: colors.text
    },
    grid: {
      vertLines: { color: colors.grid },
      horzLines: { color: colors.grid }
    },
    timeScale: { timeVisible: false },
    rightPriceScale: { borderVisible: false }
  });
  charts.push({ chart, element });
  return chart;
}

function line(chart, data, key, color) {
  const series = chart.addLineSeries({
    color, lineWidth: 2,
    priceLineVisible: false,
    lastValueVisible: true
  });
  series.setData(
    data.filter(x => x[key] !== null &&
      Number.isFinite(x[key]))
      .map(x => ({ time: x.time, value: x[key] }))
  );
  return series;
}

function clearCharts() {
  charts.forEach(item => item.chart.remove());
  charts.length = 0;
}

async function loadStock() {
  const symbol = document.getElementById("symbol").value;
  const status = document.getElementById("status");
  status.textContent = "Loading " + symbol + "...";

  try {
    const response = await fetch(
      "charts/data/" + symbol + ".json?t=" + Date.now()
    );
    if (!response.ok) {
      throw new Error("Data file unavailable: " + response.status);
    }
    const result = await response.json();
    const data = result.candles || [];
    if (!data.length) throw new Error("No candle data");

    clearCharts();

    const price = makeChart("priceChart");
    const candles = price.addCandlestickSeries({
      upColor: "#26a69a",
      downColor: "#ef5350",
      borderVisible: false,
      wickUpColor: "#26a69a",
      wickDownColor: "#ef5350"
    });
    candles.setData(data.map(x => ({
      time: x.time,
      open: x.open,
      high: x.high,
      low: x.low,
      close: x.close
    })));

    line(price, data, "ema20", "#f5c542");
    line(price, data, "ema50", "#42a5f5");
    line(price, data, "ema200", "#b388ff");

    const rsi = makeChart("rsiChart");
    line(rsi, data, "rsi14", "#c084fc");

    const macd = makeChart("macdChart");
    line(macd, data, "macd", "#42a5f5");
    line(macd, data, "macd_signal", "#ffb74d");

    price.timeScale().fitContent();
    rsi.timeScale().fitContent();
    macd.timeScale().fitContent();

    document.getElementById("heading").textContent =
      symbol + " – Daily Candlestick Chart";

    status.textContent =
      "Loaded " + data.length + " daily candles | " +
      "Last candle: " + data[data.length - 1].time;

  } catch (error) {
    status.textContent = "Error: " + error.message;
  }
}

window.addEventListener("resize", () => {
  charts.forEach(item => {
    item.chart.applyOptions({
      width: item.element.clientWidth
    });
  });
});

loadStock();
</script>
</body>
</html>
